name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      model:
        description: "Model to evaluate (runs the LLM eval, needs ANTHROPIC_API_KEY secret)"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" bandit pip-audit
      - name: Unit, guardrail and MCP tests
        run: pytest -q
      - name: Eval regression gate (deterministic path)
        run: python -m invoice_agent.evals --extractor heuristic --baseline evals/baseline_heuristic.json --max-drop 0.0
      - name: Security scans
        run: |
          bandit -q -r src
          pip-audit --skip-editable
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-report, path: evals/results/ }

  llm-eval:
    if: github.event_name == 'workflow_dispatch' && inputs.model != ''
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Evaluate model on the full dataset
        run: |
          python -m invoice_agent.evals --extractor claude --model "${{ inputs.model }}" \
            $( [ -f evals/baseline_claude.json ] && echo --baseline evals/baseline_claude.json )
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: llm-eval-report, path: evals/results/ }
